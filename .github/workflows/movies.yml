name: Movie Release Notifier

on:
  # Permite executar manualmente pela aba Actions
  workflow_dispatch:

  # Executa todos os dias às 09:00 no horário de Brasília
  schedule:
    - cron: '0 9 * * *'
      timezone: 'America/Sao_Paulo'

permissions:
  contents: write

jobs:
  notify-movies:
    name: Check movie releases

    runs-on: ubuntu-latest

    env:
      TMDB_ACCESS_TOKEN: ${{ secrets.TMDB_ACCESS_TOKEN }}
      DISCORD_MOVIES_WEBHOOK_URL: ${{ secrets.DISCORD_MOVIES_WEBHOOK_URL }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Check movie releases
        run: npm start

      - name: Save notification state
        shell: bash
        run: |
          if git diff --quiet -- data/sent-movies.json; then
            echo "Nenhuma alteração no estado dos filmes."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/sent-movies.json

          git commit -m "chore: update sent movie state"

          git push
