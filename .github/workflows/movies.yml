name: Movie Release Notifier

on:
  workflow_dispatch:

  schedule:
    - cron: '0 9 * * *'
      timezone: 'America/Sao_Paulo'

concurrency:
  group: movie-release-notifier
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  notify-movies:
    name: Check movie releases

    runs-on: ubuntu-latest

    env:
      TMDB_ACCESS_TOKEN: ${{ secrets.TMDB_ACCESS_TOKEN }}
      DISCORD_MOVIES_WEBHOOK_URL: ${{ secrets.DISCORD_MOVIES_WEBHOOK_URL }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Check movie releases
        run: npm start

      - name: Save notification state
        shell: bash
        run: |
          if git diff --quiet -- data/sent-movies.json; then
            echo "Nenhuma alteração no estado dos filmes."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/sent-movies.json
          git commit -m "🔧 chore(updated): Atualizado o estado dos filmes enviados"

          echo "Sincronizando com a branch remota..."

          git pull --rebase origin main

          git push origin HEAD:main
