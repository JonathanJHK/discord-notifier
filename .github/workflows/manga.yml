name: Manga Release Notifier

on:
  workflow_dispatch:

  schedule:
    # 14:30 BRT = 14:30 UTC
    - cron: '30 14 * * *'

concurrency:
  group: discord-notifier-state
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  notify-manga:
    name: Check manga releases

    runs-on: ubuntu-latest

    env:
      DISCORD_MANGA_WEBHOOK_URL: ${{ secrets.DISCORD_MANGA_WEBHOOK_URL }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Check manga releases
        run: npm run manga:start

      - name: Save manga state
        shell: bash
        run: |
          if git diff --quiet -- data/sent-manga.json; then
            echo "Nenhuma alteração no estado dos mangás."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/sent-manga.json
          git commit -m "🔧 chore(updated): Atualizado o estado dos mangás enviados"

          git pull --rebase origin main
          git push origin HEAD:main
